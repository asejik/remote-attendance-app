name: Android release APK

# Production APK: built from a version tag (e.g. v1.0.0) against the PRODUCTION
# Supabase project and signed with the release key. Published to a draft
# GitHub release for that tag; you review and publish it.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check required secrets
        env:
          URL: ${{ secrets.PROD_VITE_SUPABASE_URL }}
          KEY: ${{ secrets.PROD_VITE_SUPABASE_ANON_KEY }}
          KS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          KSPW: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          for v in URL KEY KS KSPW; do
            if [ -z "${!v}" ]; then echo "::error::A required production secret ($v) is missing"; exit 1; fi
          done
      - run: npm ci
      - name: Build web app (production)
        env:
          VITE_SUPABASE_URL: ${{ secrets.PROD_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npx vite build
      - run: npm run check:secrets
      - run: npx cap sync android
      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Assemble release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK is signed with the release key
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          openssl pkcs12 -in "$RELEASE_KEYSTORE" -nokeys -passin env:RELEASE_KEYSTORE_PASSWORD \
            | openssl x509 -outform der > "$RUNNER_TEMP/release-cert.der"
          python3 - "$RUNNER_TEMP/release-cert.der" android/app/build/outputs/apk/release/app-release.apk <<'PY'
          import sys
          cert, apk = (open(p, 'rb').read() for p in sys.argv[1:3])
          if cert not in apk:
              sys.exit('Release APK is NOT signed with the release key.')
          print('Release APK signed with the release key.')
          PY
          rm -f "$RELEASE_KEYSTORE"
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "attendance-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "attendance-${GITHUB_REF_NAME}.apk" --draft \
            --title "Attendance ${GITHUB_REF_NAME}" --notes "Production build ${GITHUB_REF_NAME} (versionCode ${GITHUB_RUN_NUMBER})."
