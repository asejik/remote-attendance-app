name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Placeholder values: the build only needs them to exist. Never put real secrets here.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the migration check compares with the previous commit
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:secrets
      - run: npm run lint
      - name: Migration names, rollbacks and order
        run: npm run check:migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
