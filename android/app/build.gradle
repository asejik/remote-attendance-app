apply plugin: 'com.android.application'

android {
    namespace = "com.asejik.attendance"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.asejik.attendance"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Set by the release workflow; every release must have a higher versionCode.
        versionCode((System.getenv('VERSION_CODE') ?: '1') as Integer)
        versionName(System.getenv('VERSION_NAME') ?: '1.0')
        // Native crash reporting (Sentry Android SDK). Set by the CI workflows;
        // an empty DSN leaves the SDK switched off.
        manifestPlaceholders = [
            sentryDsn: System.getenv('SENTRY_DSN') ?: '',
            sentryEnvironment: System.getenv('SENTRY_ENVIRONMENT') ?: 'local',
        ]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // CI test builds sign with a shared debug key (path in DEBUG_KEYSTORE) so new
    // APKs install over old ones and keep queued offline records. Locally,
    // without DEBUG_KEYSTORE, Android's default debug key is used.
    signingConfigs {
        debug {
            def sharedKeystore = System.getenv('DEBUG_KEYSTORE')
            if (sharedKeystore) {
                storeFile file(sharedKeystore)
                storeType 'pkcs12'
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        // Production key, only in the release workflow. Losing it means installed
        // apps can never be updated, so it is also kept offline by the owner.
        release {
            def releaseKeystore = System.getenv('RELEASE_KEYSTORE')
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storeType 'pkcs12'
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: 'attendance'
                keyPassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('RELEASE_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Java/Kotlin crashes and app-not-responding freezes. The web layer reports through @sentry/react.
    implementation 'io.sentry:sentry-android-core:8.60.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
